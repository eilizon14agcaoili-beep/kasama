<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RGCD - Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="gate">
    <h1>RGCD App</h1>

    <!-- Login Form -->
    <form id="login-form" class="auth-card">
      <h3>Sign In</h3>
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit" id="login-btn">Sign In</button>
      <p id="login-error" class="error-msg"></p>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="auth-card">
      <h3>Create Account</h3>
      <input type="text" id="reg-name" placeholder="Your Name / Display Name" required />
      <input type="email" id="reg-email" placeholder="Email" required />
      <input type="password" id="reg-password" placeholder="Password" required />
      <button type="submit" id="reg-btn">Register</button>
      <p id="reg-error" class="error-msg"></p>
    </form>
  </div>

  <div id="toast" class="hidden"></div>

  <!-- Firebase & App Script -->
  <script type="module" src="auth.js"></script>
</body>
</html>
