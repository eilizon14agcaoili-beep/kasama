<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kasama – Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth">
    <section class="auth__map" aria-hidden="true">
      <div class="map-visual-container">
        <span class="map-pin pin--a"><b>Delivery Rider 1</b></span>
        <span class="map-pin pin--b"><b>Messenger 2</b></span>
        <span class="map-pin pin--c"><b>Field Agent 3</b></span>
        <div class="rider-traveler" title="Active Rider">
          <span class="rider-icon">🛵</span>
        </div>
      </div>
      <h1><span>Know your</span> <span>people are</span> <span>safe on the road.</span></h1>
    </section>

    <section class="auth__panel">
      <div class="card">
        <h2 id="title">Log in</h2>
        <p class="sub" id="subtitle">Welcome back. Your circle is waiting.</p>

        <form id="auth-form" novalidate>
          <div id="name-row" class="hidden">
            <label for="name">Your name</label>
            <input id="name" type="text" autocomplete="name">
          </div>

          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>

          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" minlength="6" required>

          <p class="error" id="error" role="alert"></p>
          <button class="btn" id="submit" type="submit">Log in</button>
        </form>

        <p class="switch">
          <span id="switch-text">No account yet?</span>
          <button type="button" id="switch-btn">Create an account</button>
        </p>
      </div>
    </section>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
